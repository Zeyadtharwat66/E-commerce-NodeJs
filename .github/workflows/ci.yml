name: Node.js CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate JavaScript
        run: |
          node --check server.js
          node --check config/database.js
          node --check middleware/errormiddleware.js
          node --check models/categoryModel.js
          node --check routes/categoryRoute.js
          node --check services/categoryService.js
          node --check utils/ApiError.js
